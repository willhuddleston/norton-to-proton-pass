name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Run tests
        run: npm test

      - name: Build single-file HTML
        run: npm run build

      - name: Write SHA-256 checksum
        working-directory: dist
        run: |
          sha256sum norton-to-proton-pass.html > norton-to-proton-pass.html.sha256
          cat norton-to-proton-pass.html.sha256

      - name: Create GitHub Release with assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          hash="$(cut -d' ' -f1 dist/norton-to-proton-pass.html.sha256)"
          notes="$(printf 'SHA-256 of `norton-to-proton-pass.html`:\n\n```\n%s\n```\n\nSee the README for how to verify it.' "$hash")"
          gh release create "$TAG" \
            dist/norton-to-proton-pass.html \
            dist/norton-to-proton-pass.html.sha256 \
            --title "$TAG" \
            --notes "$notes" \
            --generate-notes \
            --verify-tag
